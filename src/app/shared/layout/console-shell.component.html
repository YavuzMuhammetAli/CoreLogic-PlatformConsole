<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">CL</span>
      <span class="brand-text">Platform</span>
    </div>

    <nav class="nav">
      @for (item of nav(); track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [attr.aria-label]="item.labelKey | t">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <span class="env-badge">env: dev</span>
    </div>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path>
      </svg>
      <input class="topbar-search-input" type="search"
             [placeholder]="'pc.search' | t" [attr.aria-label]="'pc.search' | t" />
      <kbd>⌘K</kbd>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" type="button" (click)="language.toggle()"
              [attr.aria-label]="'TR / EN'">
        {{ language.lang() === 'tr' ? 'TR' : 'EN' }}
      </button>

      <button class="icon-btn" type="button" (click)="theme.toggle()" aria-label="Theme">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        }
      </button>

      <div class="user-chip">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ user()?.name || user()?.email }}</span>
        <button class="btn btn-ghost btn-sm" type="button" (click)="logout()">
          {{ 'pc.logout' | t }}
        </button>
      </div>
    </div>
  </header>

  <!-- İçerik -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
