<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">CL</span>
      <span class="brand-text">Platform</span>
    </div>

    <nav class="nav">
      @for (item of nav(); track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active" #rla="routerLinkActive"
          [attr.aria-label]="item.labelKey | t">
          <app-icon [name]="item.icon" [filled]="rla.isActive" />
          <span>{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <span class="env-badge">env: dev</span>
    </div>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-search" role="search">
      <app-icon name="search" size="16" />
      <input class="topbar-search-input" type="search"
             [placeholder]="'pc.search' | t" [attr.aria-label]="'pc.search' | t" />
      <kbd>⌘K</kbd>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" type="button" (click)="language.toggle()"
              [attr.aria-label]="'TR / EN'">
        {{ language.lang() === 'tr' ? 'TR' : 'EN' }}
      </button>

      <button class="icon-btn" type="button" (click)="theme.toggle()" aria-label="Theme">
        @if (theme.theme() === 'dark') {
          <app-icon name="light_mode" size="16" />
        } @else {
          <app-icon name="dark_mode" size="16" />
        }
      </button>

      <div class="user-chip">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ user()?.name || user()?.email }}</span>
        <button class="btn btn-ghost btn-sm" type="button" (click)="logout()">
          <app-icon name="logout" size="14" />
          {{ 'pc.logout' | t }}
        </button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
